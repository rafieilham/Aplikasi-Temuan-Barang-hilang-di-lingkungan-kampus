<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Akun Mahasiswa - FoundIt!</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; min-height: 100vh; background-color: #f8f9fa; }
    .bg-foundit-gradient { background: linear-gradient(135deg, #0d5c52 0%, #09423b 50%, #052925 100%); }
    .btn-foundit { background-color: #0f8a77; color: #ffffff; border: none; }
    .btn-foundit:hover { background-color: #0c7262; color: #ffffff; }
    .text-foundit { color: #0f8a77; }
    .form-control:focus { border-color: #0f8a77; box-shadow: 0 0 0 0.25rem rgba(15, 138, 119, 0.15); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <div class="container-fluid min-vh-100 d-flex flex-column p-0">
    <div class="row g-0 flex-grow-1">
      <div class="col-lg-5 bg-foundit-gradient text-white p-4 p-lg-5 d-flex flex-column justify-content-between position-relative">
        <div class="d-flex align-items-center gap-3">
          <div class="rounded-3 d-flex align-items-center justify-content-center fw-bold shadow" style="width: 42px; height: 42px; background-color: #2dd4bf; color: #052925;">
            🔍
          </div>
          <span class="fs-4 fw-bold">FoundIt!</span>
        </div>
        <div class="my-5 py-lg-4" style="max-width: 420px;">
          <h1 class="display-6 fw-bold mb-3">Bergabung dengan Portal Kampus</h1>
          <p class="text-white-50">Daftarkan akun Anda untuk mempermudah pelaporan dan pelacakan barang hilang maupun temuan di area kampus.</p>
        </div>
        <div class="text-white-50 small">Sistem Resmi Kampus &middot; Terintegrasi Database</div>
      </div>

      <div class="col-lg-7 bg-white d-flex align-items-center justify-content-center p-4 p-sm-5">
        <div class="w-100" style="max-width: 460px;">
          <div class="mb-4">
            <h2 class="fs-3 fw-bold text-dark">Daftar Akun Mahasiswa</h2>
            <p class="text-muted small">Lengkapi formulir registrasi di bawah ini</p>
          </div>

          <div id="registerAlert" class="alert d-none small mb-3" role="alert"></div>

          <form onsubmit="handleRegister(event)" class="vstack gap-3">
            <div class="row g-2">
              <div class="col-sm-6">
                <label class="form-label small fw-semibold text-secondary">Nama Lengkap</label>
                <input type="text" id="regName" required class="form-control py-2" placeholder="Nama Anda" />
              </div>
              <div class="col-sm-6">
                <label class="form-label small fw-semibold text-secondary">NIM</label>
                <input type="text" id="regNIM" required class="form-control py-2" placeholder="NIM Kampus" />
              </div>
            </div>

            <div class="row g-2">
              <div class="col-sm-6">
                <label class="form-label small fw-semibold text-secondary">Email Kampus</label>
                <input type="email" id="regEmail" required class="form-control py-2" placeholder="nama@student.ac.id" />
              </div>
              <div class="col-sm-6">
                <label class="form-label small fw-semibold text-secondary">No. Telepon / WA</label>
                <input type="tel" id="regPhone" required class="form-control py-2" placeholder="08xxxxxxxxxx" />
              </div>
            </div>

            <div>
              <label class="form-label small fw-semibold text-secondary">Password</label>
              <input type="password" id="regPassword" required minlength="6" class="form-control py-2" placeholder="Minimal 6 karakter" />
            </div>

            <button type="submit" id="btnSubmit" class="btn btn-foundit fw-semibold py-2 w-100 shadow-sm">
              Daftar Sekarang
            </button>
          </form>

          <p class="text-center small text-muted mt-4 mb-0">
            Sudah memiliki akun?
            <a href="login.html" class="fw-semibold text-decoration-none text-foundit ms-1">Masuk di sini</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function handleRegister(event) {
      event.preventDefault();
      const alertBox = document.getElementById('registerAlert');
      const submitBtn = document.getElementById('btnSubmit');

      const name = document.getElementById('regName').value.trim();
      const nim = document.getElementById('regNIM').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;

      if (nim.toLowerCase() === 'admin') {
        alertBox.textContent = 'NIM "admin" tidak dapat didaftarkan kembali!';
        alertBox.className = 'alert alert-danger small mb-3';
        alertBox.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      // Cek apakah NIM sudah ada di Supabase
      const { data: existingUser } = await supabaseClient
        .from('users')
        .select('nim')
        .eq('nim', nim)
        .maybeSingle();

      if (existingUser) {
        alertBox.textContent = 'NIM ini sudah terdaftar! Silakan langsung login.';
        alertBox.className = 'alert alert-warning small mb-3';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daftar Sekarang';
        return;
      }

      // Masukkan data ke tabel users
      const { error } = await supabaseClient
        .from('users')
        .insert([{ nim, name, email, phone, password, role: 'mahasiswa' }]);

      if (error) {
        alertBox.textContent = 'Gagal mendaftar: ' + error.message;
        alertBox.className = 'alert alert-danger small mb-3';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daftar Sekarang';
        return;
      }

      alertBox.textContent = 'Pendaftaran berhasil! Mengalihkan ke login...';
      alertBox.className = 'alert alert-success small mb-3';
      alertBox.classList.remove('d-none');

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1000);
    }
  </script>
</body>
</html>

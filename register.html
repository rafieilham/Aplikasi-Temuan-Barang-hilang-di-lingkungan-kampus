<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrasi - FoundIt! Politeknik Negeri Batam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #0f8a77;
      --primary-hover: #0c7262;
      --bg-page: #f8fafc;
      --border-color: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }
    html {
      font-size: 17.5px;
    }
    @media (min-width: 1400px) {
      html {
        font-size: 18.5px;
      }
    }
    @media (min-width: 1800px) {
      html {
        font-size: 19.5px;
      }
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .top-navbar {
      background-color: #ffffff;
      border-bottom: 1.5px solid var(--border-color);
      padding: 16px 0;
    }
    .brand-title {
      font-size: 1.55rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .brand-logo-badge {
      width: 42px;
      height: 42px;
      background-color: var(--primary-color);
      color: #ffffff;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .institution-text {
      color: var(--text-muted);
      font-size: 1.05rem;
      font-weight: 600;
    }
    .auth-card {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 48px;
      box-shadow: 0 10px 32px rgba(15, 23, 42, 0.04);
      width: 100%;
      max-width: 540px;
    }
    .auth-title {
      font-size: 2.3rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .auth-subtitle {
      color: var(--text-muted);
      font-size: 1.12rem;
      margin-bottom: 8px;
    }
    .required-legend {
      font-size: 0.92rem;
      color: #dc2626;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .form-label {
      font-size: 1.02rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
      display: block;
    }
    .form-control {
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1.05rem;
      color: var(--text-main);
      min-height: 52px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(15, 138, 119, 0.15);
    }
    .form-hint {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 6px;
      margin-bottom: 0;
    }
    .btn-foundit {
      background-color: var(--primary-color);
      color: #ffffff;
      font-weight: 700;
      font-size: 1.12rem;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      min-height: 54px;
      transition: background-color 0.15s ease;
    }
    .btn-foundit:hover {
      background-color: var(--primary-hover);
      color: #ffffff;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>

  <!-- Header Atas Sesuai Wireframe Layar 02 -->
  <header class="top-navbar">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <div class="brand-logo-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <span class="brand-title">FoundIt!</span>
      </div>
      <span class="institution-text">Politeknik Negeri Batam</span>
    </div>
  </header>

  <!-- Area Konten Registrasi -->
  <main class="flex-grow-1 d-flex flex-column align-items-center justify-content-center py-5 px-3">
    <div class="auth-card">
      <h1 class="auth-title">Registrasi</h1>
      <p class="auth-subtitle">Daftarkan data mahasiswa untuk membuat laporan.</p>
      <div class="required-legend">* Wajib diisi</div>

      <div id="registerAlert" class="alert d-none small mb-3 py-2 px-3" role="alert"></div>

      <form onsubmit="handleRegister(event)" class="vstack gap-3">
        <div>
          <label for="regName" class="form-label">Nama lengkap *</label>
          <input 
            type="text" 
            id="regName" 
            class="form-control" 
            placeholder="Masukkan nama lengkap" 
            required 
          />
        </div>

        <div>
          <label for="regNIM" class="form-label">NIM *</label>
          <input 
            type="text" 
            id="regNIM" 
            class="form-control" 
            placeholder="Masukkan NIM" 
            required 
          />
        </div>

        <div>
          <label for="regPhone" class="form-label">Kontak WhatsApp *</label>
          <input 
            type="tel" 
            id="regPhone" 
            class="form-control" 
            placeholder="Contoh: 081234567890" 
            required 
          />
          <p class="form-hint">Nomor aktif, 10–15 digit.</p>
        </div>

        <div>
          <label for="regPassword" class="form-label">Password *</label>
          <input 
            type="password" 
            id="regPassword" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            minlength="6" 
          />
        </div>

        <div>
          <label for="regConfirmPassword" class="form-label">Konfirmasi password *</label>
          <input 
            type="password" 
            id="regConfirmPassword" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            minlength="6" 
          />
          <p class="form-hint">Harus sama dengan password.</p>
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-foundit w-100 mt-2">
          Daftar
        </button>
      </form>

      <div class="text-start mt-4 pt-1">
        <span class="small text-muted">Sudah memiliki akun?</span>
        <a href="login.html" class="small fw-semibold text-decoration-none" style="color: var(--primary-color);">Masuk</a>
      </div>
    </div>
  </main>

  <script>
    async function handleRegister(event) {
      event.preventDefault();
      const alertBox = document.getElementById('registerAlert');
      const submitBtn = document.getElementById('btnSubmit');

      const name = document.getElementById('regName').value.trim();
      const nim = document.getElementById('regNIM').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      // Validasi konfirmasi password
      if (password !== confirmPassword) {
        alertBox.textContent = 'Konfirmasi password tidak sesuai. Harus sama dengan password.';
        alertBox.className = 'alert alert-danger small mb-3 py-2 px-3';
        alertBox.classList.remove('d-none');
        return;
      }

      // Validasi nomor telepon/WA (10 - 15 digit angka)
      const phoneClean = phone.replace(/[^0-9]/g, '');
      if (phoneClean.length < 10 || phoneClean.length > 15) {
        alertBox.textContent = 'Nomor WhatsApp tidak valid. Masukkan nomor aktif 10–15 digit.';
        alertBox.className = 'alert alert-danger small mb-3 py-2 px-3';
        alertBox.classList.remove('d-none');
        return;
      }

      if (nim.toLowerCase() === 'admin') {
        alertBox.textContent = 'NIM "admin" tidak dapat didaftarkan kembali.';
        alertBox.className = 'alert alert-danger small mb-3 py-2 px-3';
        alertBox.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      try {
        // Cek apakah NIM sudah terdaftar
        const { data: existingUser } = await supabaseClient
          .from('users')
          .select('nim')
          .eq('nim', nim)
          .maybeSingle();

        if (existingUser) {
          alertBox.textContent = 'NIM ini sudah terdaftar. Silakan langsung masuk.';
          alertBox.className = 'alert alert-warning small mb-3 py-2 px-3';
          alertBox.classList.remove('d-none');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Daftar';
          return;
        }

        // Masukkan data mahasiswa baru ke tabel users
        const { error } = await supabaseClient
          .from('users')
          .insert([
            {
              nim: nim,
              name: name,
              phone: phoneClean,
              password: password,
              role: 'mahasiswa'
            }
          ]);

        if (error) {
          alertBox.textContent = 'Pendaftaran gagal: ' + error.message;
          alertBox.className = 'alert alert-danger small mb-3 py-2 px-3';
          alertBox.classList.remove('d-none');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Daftar';
          return;
        }

        alertBox.textContent = 'Pendaftaran berhasil. Mengalihkan ke halaman masuk...';
        alertBox.className = 'alert alert-success small mb-3 py-2 px-3';
        alertBox.classList.remove('d-none');

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1000);

      } catch (err) {
        alertBox.textContent = 'Terjadi kesalahan sistem: ' + err.message;
        alertBox.className = 'alert alert-danger small mb-3 py-2 px-3';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daftar';
      }
    }
  </script>
</body>
</html>

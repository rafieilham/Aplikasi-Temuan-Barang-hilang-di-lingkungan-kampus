<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk Mahasiswa - FoundIt!</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; min-height: 100vh; background-color: #f8f9fa; }
    .bg-foundit-gradient { background: linear-gradient(135deg, #0d5c52 0%, #09423b 50%, #052925 100%); }
    .btn-foundit { background-color: #0f8a77; color: #ffffff; border: none; }
    .btn-foundit:hover { background-color: #0c7262; color: #ffffff; }
    .text-foundit { color: #0f8a77; }
    .form-control:focus { border-color: #0f8a77; box-shadow: 0 0 0 0.25rem rgba(15, 138, 119, 0.15); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <div class="container-fluid min-vh-100 d-flex flex-column p-0">
    <div class="row g-0 flex-grow-1">

      <!-- Panel Kiri -->
      <div class="col-lg-5 bg-foundit-gradient text-white p-4 p-lg-5 d-flex flex-column justify-content-between position-relative">
        <div class="d-flex align-items-center gap-3">
          <div class="rounded-3 d-flex align-items-center justify-content-center fw-bold shadow" style="width: 42px; height: 42px; background-color: #2dd4bf; color: #052925;">
            🔍
          </div>
          <span class="fs-4 fw-bold">FoundIt!</span>
        </div>
        <div class="my-5 py-lg-4" style="max-width: 420px;">
          <h1 class="display-6 fw-bold mb-3">Portal Mahasiswa</h1>
          <p class="text-white-50">Lacak barang hilang atau bantu teman kampus menemukan barang temuan mereka secara cepat dan transparan.</p>
        </div>
        <div class="text-white-50 small">Khusus Mahasiswa Aktif Kampus</div>
      </div>

      <!-- Panel Kanan: Form Login Mahasiswa -->
      <div class="col-lg-7 bg-white d-flex align-items-center justify-content-center p-4 p-sm-5">
        <div class="w-100" style="max-width: 420px;">
          <div class="mb-4">
            <h2 class="fs-3 fw-bold text-dark">Masuk Mahasiswa</h2>
            <p class="text-muted small">Masukkan Nomor Induk Mahasiswa (NIM) dan Password Anda</p>
          </div>

          <div id="loginAlert" class="alert d-none small mb-3" role="alert"></div>

          <form onsubmit="handleLogin(event)" class="vstack gap-3">
            <div>
              <label class="form-label small fw-semibold text-secondary">NIM Mahasiswa</label>
              <input type="text" id="loginNIM" required class="form-control py-2" placeholder="Masukkan NIM terdaftar" />
            </div>

            <div>
              <label class="form-label small fw-semibold text-secondary">Password</label>
              <div class="input-group">
                <input type="password" id="loginPassword" required class="form-control py-2" placeholder="Masukkan password" />
                <button type="button" class="btn btn-light border text-muted" onclick="togglePassword()">👁️</button>
              </div>
            </div>

            <button type="submit" id="btnLogin" class="btn btn-foundit fw-semibold py-2 w-100 shadow-sm">
              Masuk ke Dasbor Mahasiswa
            </button>
          </form>

          <p class="text-center small text-muted mt-4 mb-0">
            Belum punya akun?
            <a href="register.html" class="fw-semibold text-decoration-none text-foundit ms-1">Daftar Sekarang</a>
          </p>
        </div>
      </div>

    </div>
  </div>

  <script>
    function togglePassword() {
      const field = document.getElementById('loginPassword');
      field.type = field.type === 'password' ? 'text' : 'password';
    }

    async function handleLogin(event) {
      event.preventDefault();
      const alertBox = document.getElementById('loginAlert');
      const submitBtn = document.getElementById('btnLogin');

      const nimInput = document.getElementById('loginNIM').value.trim();
      const passwordInput = document.getElementById('loginPassword').value;

      // Tolak kata "admin" dengan pesan standar (tidak membocorkan info)
      if (nimInput.toLowerCase() === 'admin') {
        alertBox.textContent = 'NIM mahasiswa tidak ditemukan! Silakan daftar terlebih dahulu.';
        alertBox.className = 'alert alert-danger small mb-3';
        alertBox.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Memverifikasi...';

      // Cari khusus akun dengan role 'mahasiswa'
      const { data: user, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('nim', nimInput)
        .eq('role', 'mahasiswa')
        .maybeSingle();

      if (error || !user) {
        alertBox.textContent = 'NIM mahasiswa tidak ditemukan! Silakan daftar terlebih dahulu.';
        alertBox.className = 'alert alert-danger small mb-3';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk ke Dasbor Mahasiswa';
        return;
      }

      // Validasi password
      if (user.password !== passwordInput) {
        alertBox.textContent = 'Password yang Anda masukkan salah!';
        alertBox.className = 'alert alert-danger small mb-3';
        alertBox.classList.remove('d-none');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk ke Dasbor Mahasiswa';
        return;
      }

      // Buat sesi login
      localStorage.setItem('foundit_session', JSON.stringify({
        id: user.id,
        name: user.name,
        nim: user.nim,
        role: user.role
      }));

      alertBox.textContent = 'Login berhasil! Mengalihkan ke Dasbor Mahasiswa...';
      alertBox.className = 'alert alert-success small mb-3';
      alertBox.classList.remove('d-none');

      setTimeout(() => {
        window.location.href = 'dashboard_mahasiswa.html';
      }, 700);
    }
  </script>
</body>
</html>

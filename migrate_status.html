<!DOCTYPE html>
<html>
<head><title>Migrate Status DB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<h3>Migrating status "dalam klaim" → "proses"</h3>
<pre id="log">Running...</pre>
<script>
(async () => {
  const log = document.getElementById('log');
  const { data, error } = await supabaseClient
    .from('items')
    .update({ status: 'proses' })
    .eq('status', 'dalam klaim')
    .select();
  if (error) {
    log.textContent = 'ERROR: ' + error.message;
  } else {
    log.textContent = `Done! Updated ${data.length} items.\n` + JSON.stringify(data.map(i => ({id: i.id, nama: i.nama_barang, status: i.status})), null, 2);
  }
})();
</script>
</body>
</html>

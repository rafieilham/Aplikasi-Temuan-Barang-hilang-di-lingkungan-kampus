<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f8a77" />
      <stop offset="100%" stop-color="#095549" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  
  <!-- Subtle pattern grid -->
  <g opacity="0.06">
    <circle cx="100" cy="100" r="40" fill="#0f8a77" />
    <circle cx="700" cy="400" r="60" fill="#0f8a77" />
    <circle cx="680" cy="80" r="30" fill="#0f8a77" />
    <circle cx="120" cy="420" r="50" fill="#0f8a77" />
  </g>

  <!-- Central Emblem Container -->
  <g transform="translate(400, 210)">
    <!-- Circle badge -->
    <circle r="72" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="drop-shadow(0px 8px 16px rgba(15,23,42,0.06))" />
    <circle r="58" fill="url(#iconGrad)" />
    
    <!-- Camera / Box Icon inside badge -->
    <path d="M -22 -8 L -16 -18 L 16 -18 L 22 -8 L 26 -8 C 29 -8 32 -5 32 -2 L 32 20 C 32 23 29 26 26 26 L -26 26 C -29 26 -32 23 -32 20 L -32 -2 C -32 -5 -29 -8 -26 -8 Z" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="0" cy="9" r="10" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="20" cy="-1" r="2.5" fill="#2dd4bf" />
  </g>

  <!-- Typography -->
  <text x="400" y="325" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle" letter-spacing="0.5">
    Foto Dokumentasi Belum Tersedia
  </text>
  <text x="400" y="352" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">
    FoundIt! &bull; Sistem Layanan Barang Kampus Politeknik Negeri Batam
  </text>
</svg>
